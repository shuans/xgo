name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check goreleaser files
      run: |
        pip install --no-input pyyaml
        python .github/workflows/check_goreleaser_config.py

    - name: Install Snapcraft
      uses: samuelmeuli/action-snapcraft@v3

    - name: Checkout tag
      run: |
        tag_name="${GITHUB_REF##*/}"
        echo Current tag: $tag_name
        git checkout $tag_name
        echo "TAG_NAME=${tag_name}" >> $GITHUB_ENV

    - name: Check pre-release
      run: |
        tag="${TAG_NAME}"
        # check stable version format vX.Y.Z
        if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "This is a pre-release: $tag"
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
        fi

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4


    - name: Release with goreleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        # either 'goreleaser' (default) or 'goreleaser-pro'
        distribution: goreleaser
        version: latest
        args: release --clean -p 4 --skip=docker,winget,snapcraft
      env:
        GITHUB_TOKEN: ${{ github.token }}
